<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case & CaseLite</title>
    <link rel="icon" type="image/x-icon" href="../assets/images/jlfavicon.ico">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/case-study.css">
</head>

<body>

<div class="orb orb--primary"></div>
<div class="orb orb--secondary"></div>
<div class="orb-vignette"></div>


<main class="case-page">
    <article class="case-study glass">
        <!-- TOP SECTION -->
        <section class="case-hero">
            <div class="case-hero__copy">
                <p class="case-eyebrow">
                    FRONTEND / FULL-STACK DEVELOPMENT
                </p>
                <h1 class="case-title">
                    CASE / CaseLite
                </h1>
                <p class="case-description">
                    Project description goes here. This area can explain the project,
                    your role, the problem being solved, and the type of work you
                    contributed.
                </p>
                <div class="case-tags">
                    <span>HTML5</span>
                    <span>CSS3</span>
                    <span>JavaScript</span>
                    <span>Python</span>
                    <span>Flask</span>
                    <span>SQL</span>
                </div>
            </div>

            <!-- STATIC HERO IMAGE -->
            <div class="case-feature">
                <img src="../assets/images/soft/enterprise_mockup.png" alt="Project preview">
            </div>
        </section>

        <!-- GALLERY -->
        <section class="case-gallery">
            <button class="gallery-thumb" data-full="">
                <img src="../assets/images/soft/original_case.png" alt="CASE dashboard">
            </button>
            <button class="gallery-thumb" data-full="">
                <img src="../assets/images/soft/original_case_b.png" alt="CASE dashboard">
            </button>
            <button class="gallery-thumb" data-full="">
                <img src="../assets/images/soft/case_cm.png" alt="CASE dashboard">
            </button>
            <button class="gallery-thumb" data-full="">
                <img src="../assets/images/soft/case_audit.png" alt="CASE dashboard">
            </button>
            <button class="gallery-thumb" data-full="">
                <img src="../assets/images/soft/activity_page.png" alt="CASE dashboard">
            </button>
            <button class="gallery-thumb" data-full="">
                <img src="../assets/images/soft/risk_page.png" alt="CASE dashboard">
            </button>
            <button class="gallery-thumb" data-full="">
                <img src="../assets/images/soft/case_req.png" alt="CASE dashboard">
            </button>
            <button class="gallery-thumb" data-full="">
                <img src="../assets/images/soft/caseLite.png" alt="CASE dashboard">
            </button>
        </section>
    </article>

</main>


<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" aria-hidden="true">
    <button
            class="lightbox__close"
            id="lightboxClose"
            aria-label="Close image">
        ×
    </button>

    <button
            class="lightbox__arrow lightbox__arrow--left"
            id="lightboxPrev"
            aria-label="Previous image">
        ‹
    </button>

    <img
            id="lightboxImage"
            class="lightbox__image"
            src=""
            alt="">

    <button
            class="lightbox__arrow lightbox__arrow--right"
            id="lightboxNext"
            aria-label="Next image">
        ›
    </button>

</div>


<script src="../assets/js/case-study.js"></script>

</body>
</html>
